# Flow definition: scheduled-triage
#
# Consumed by scripts/sync_local.py to generate per-host stub workflows:
#   .github/workflows/myorg-scheduled-triage-claude.yml
#   .github/workflows/myorg-scheduled-triage-gemini.yml

flow: scheduled-triage
name: "@myorg Scheduled Triage"
prompt: blueprint/automation/scheduled-triage.md

triggers:
  schedule:
    - cron: "0 * * * *"  # hourly
  workflow_dispatch: {}

# Condition: always run (schedule / workflow_dispatch have no triggering event body to filter).
# Rate is governed by the cron schedule itself — to slow this flow down,
# reduce the cron frequency above. There is no separate runner-level cap.
condition: "vars.MYORG_AUTOMATION_V2 == 'true'"

defaults:
  timeout_minutes: 7
  max_turns: 25
  skip_drafts: false
  skip_fork_prs: false
