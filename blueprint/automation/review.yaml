# Flow definition: review
#
# Consumed by scripts/sync_local.py to generate per-host stub workflows:
#   .github/workflows/myorg-review-claude.yml
#   .github/workflows/myorg-review-gemini.yml

flow: review
name: "@myorg Review"
prompt: blueprint/automation/review.md

triggers:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]
  issue_comment:
    types: [created]

# Condition: fire on non-draft, non-fork PRs, or explicit /review mention by trusted user.
condition: |
  (
    (
      github.event_name == 'pull_request' &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    ) || (
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '@myorg') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    )
  ) && vars.MYORG_AUTOMATION_V2 == 'true'

defaults:
  timeout_minutes: 15
  max_turns: 50
  skip_drafts: true
  skip_fork_prs: true
