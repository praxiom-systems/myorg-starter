# Flow definition: triage
#
# Consumed by scripts/sync_local.py to generate per-host stub workflows:
#   .github/workflows/myorg-triage-claude.yml
#   .github/workflows/myorg-triage-gemini.yml

flow: triage
name: "@myorg Triage"
prompt: blueprint/automation/triage.md

triggers:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]

# Condition: fire on new issues, or an explicit `@myorg triage` mention by a
# trusted user on an issue (NOT a PR comment — `issue_comment` is shared between
# issues and PRs, so we explicitly require `!github.event.issue.pull_request`
# and the `triage` verb to keep PR comments out of this flow).
condition: |
  (
    (
      github.event_name == 'issues' &&
      contains(fromJSON('["opened","reopened"]'), github.event.action)
    ) || (
      github.event_name == 'issue_comment' &&
      !github.event.issue.pull_request &&
      contains(github.event.comment.body, '@myorg triage') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    )
  ) && vars.MYORG_AUTOMATION_V2 == 'true'

defaults:
  timeout_minutes: 7
  max_turns: 25
  skip_drafts: false
  skip_fork_prs: false
